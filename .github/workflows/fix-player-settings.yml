name: Apply Player Settings Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-test:
    if: ${{ !contains(github.event.head_commit.message, 'fix(android): wire player settings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply settings integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/android/app/src/main/java/com/alfietv/player/AlfiePlayer.kt')
          s = p.read_text()
          old = '''            setHandleAudioBecomingNoisy(true)\n            setSeekBackIncrementMs(10_000)\n            setSeekForwardIncrementMs(10_000)'''
          new = '''            setHandleAudioBecomingNoisy(true)\n            val seekMs = SettingsStore.seekSeconds(appContext).toLong() * 1000L\n            setSeekBackIncrementMs(seekMs)\n            setSeekForwardIncrementMs(seekMs)\n            autoRetryEnabled = SettingsStore.autoRetry(appContext)'''
          if old not in s:
              raise SystemExit('Expected player settings block was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build and test Android
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit player settings fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/alfietv/player/AlfiePlayer.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix(android): wire player settings"
          git push
