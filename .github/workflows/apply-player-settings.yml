name: Apply Player Settings Migration
on: push
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wire seek interval and auto retry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/android/app/src/main/java/com/alfietv/player/AlfiePlayer.kt')
          s = p.read_text()
          old = '            setSeekBackIncrementMs(10_000)\n            setSeekForwardIncrementMs(10_000)'
          new = '            val seekMs = SettingsStore.seekSeconds(appContext).toLong() * 1000L\n            setSeekBackIncrementMs(seekMs)\n            setSeekForwardIncrementMs(seekMs)\n            autoRetryEnabled = SettingsStore.autoRetry(appContext)'
          if old not in s:
              raise SystemExit('seek settings block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/alfietv/player/AlfiePlayer.kt
          git commit -m "fix(android): wire player settings"
          git push
