name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Full validation run after TV Guide upgrade.

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workspace
        run: npm run lint

      - name: Build workspace
        run: npm run build

      - name: Run tests
        run: npm test

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run build -w @alfie-tv/desktop

      - name: Test desktop package
        run: npx --yes vitest@4.1.10 run packages/desktop/src/__tests__/desktopApp.test.ts --config vitest.config.ts

      - name: Package Windows portable desktop build
        working-directory: packages/desktop
        run: npx --yes electron-builder@26.0.12 --win portable --x64 --publish never

      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v6
        with:
          name: alfie-tv-desktop-windows
          path: packages/desktop/dist/*.exe
          if-no-files-found: error

  desktop-macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run build -w @alfie-tv/desktop

      - name: Test desktop package
        run: npx --yes vitest@4.1.10 run packages/desktop/src/__tests__/desktopApp.test.ts --config vitest.config.ts

      - name: Package macOS desktop builds
        working-directory: packages/desktop
        run: npx --yes electron-builder@26.0.12 --mac dmg zip --x64 --arm64 --publish never

      - name: Upload macOS desktop builds
        uses: actions/upload-artifact@v6
        with:
          name: alfie-tv-desktop-macos
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Run Android unit tests
        run: gradle test --stacktrace

      - name: Build Android debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: alfie-tv-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-release-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: play-store
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v5

      - name: Validate stable release signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ALFIE_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ALFIE_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALFIE_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ALFIE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64" || { echo "Missing ALFIE_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing ALFIE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing ALFIE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing ALFIE_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Restore stable release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ALFIE_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/alfie-upload.jks"
          test -s "$RUNNER_TEMP/alfie-upload.jks"

      - name: Validate release keystore integrity
        env:
          ALFIE_RELEASE_STORE_PASSWORD: ${{ secrets.ALFIE_RELEASE_STORE_PASSWORD }}
          ALFIE_RELEASE_KEY_ALIAS: ${{ secrets.ALFIE_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/alfie-upload.jks" \
            -storepass "$ALFIE_RELEASE_STORE_PASSWORD" \
            -alias "$ALFIE_RELEASE_KEY_ALIAS" \
            >/dev/null
          echo "Release keystore and configured alias are valid."

      - name: Build signed release APK
        env:
          ALFIE_RELEASE_STORE_FILE: ${{ runner.temp }}/alfie-upload.jks
          ALFIE_RELEASE_STORE_PASSWORD: ${{ secrets.ALFIE_RELEASE_STORE_PASSWORD }}
          ALFIE_RELEASE_KEY_ALIAS: ${{ secrets.ALFIE_RELEASE_KEY_ALIAS }}
          ALFIE_RELEASE_KEY_PASSWORD: ${{ secrets.ALFIE_RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER" || { echo "Android SDK apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload stable release APK
        uses: actions/upload-artifact@v6
        with:
          name: alfie-tv-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build signed release AAB
        env:
          ALFIE_RELEASE_STORE_FILE: ${{ runner.temp }}/alfie-upload.jks
          ALFIE_RELEASE_STORE_PASSWORD: ${{ secrets.ALFIE_RELEASE_STORE_PASSWORD }}
          ALFIE_RELEASE_KEY_ALIAS: ${{ secrets.ALFIE_RELEASE_KEY_ALIAS }}
          ALFIE_RELEASE_KEY_PASSWORD: ${{ secrets.ALFIE_RELEASE_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload stable release AAB
        uses: actions/upload-artifact@v6
        with:
          name: alfie-tv-release-aab
          path: apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/alfie-upload.jks"
