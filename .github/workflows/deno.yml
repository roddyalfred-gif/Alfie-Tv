name: Deno

on:
  push:
    branches: ["main"]
    paths:
      - deno.json
      - deno.jsonc
      - .github/workflows/deno.yml
  pull_request:
    branches: ["main"]
    paths:
      - deno.json
      - deno.jsonc
      - .github/workflows/deno.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deno-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          if [[ -f deno.json || -f deno.jsonc ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: precheck
    if: ${{ needs.precheck.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno runtime
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      - name: Lint
        run: deno lint

      - name: Test
        run: deno test -A
