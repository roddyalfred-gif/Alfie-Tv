name: Apply Player Settings Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply settings integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/android/app/src/main/java/com/alfietv/player/AlfiePlayer.kt')
          s = p.read_text()
          old = '''            setHandleAudioBecomingNoisy(true)
            setSeekBackIncrementMs(10_000)
            setSeekForwardIncrementMs(10_000)'''
          new = '''            setHandleAudioBecomingNoisy(true)
            val seekMs = SettingsStore.seekSeconds(appContext).toLong() * 1000L
            setSeekBackIncrementMs(seekMs)
            setSeekForwardIncrementMs(seekMs)
            autoRetryEnabled = SettingsStore.autoRetry(appContext)'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'SettingsStore.seekSeconds(appContext)' not in s:
              raise SystemExit('Expected player settings block was not found')
          PY

      - name: Build and test Android
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit player settings fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/alfietv/player/AlfiePlayer.kt
          if git diff --cached --quiet; then
            echo "Player settings already applied"
            exit 0
          fi
          git commit -m "fix(android): wire player settings"
          git push origin HEAD:main
