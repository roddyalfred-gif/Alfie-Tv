name: Smart TV Builds
on:
  push:
    branches: [main, feature/smart-tv-platforms]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smart-tv-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @alfie-tv/web
      - run: node scripts/package-smart-tvs.mjs
      - name: Validate Tizen package
        run: |
          unzip -l dist/smart-tv/alfie-tv-tizen-unsigned.wgt | grep -E 'config.xml|index.html|platform-navigation.js|icon.png'
      - name: Validate webOS package
        run: |
          ar t dist/smart-tv/alfie-tv-webos-unsigned.ipk
          test -s dist/smart-tv/alfie-tv-webos-unsigned.ipk
      - uses: actions/upload-artifact@v6
        with:
          name: alfie-tv-smart-tv-packages
          path: |
            dist/smart-tv/alfie-tv-tizen-unsigned.wgt
            dist/smart-tv/alfie-tv-webos-unsigned.ipk
          if-no-files-found: error
